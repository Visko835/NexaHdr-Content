<style>
  @font-face {
    font-family: 'Neu Eichmass';
    src: url('fonts/Neu_Eichmass.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root {
    --color-bg: #050505; --color-text: #f0f0f0; --color-text-dim: #888888;
    --color-accent: #ff3333; --color-accent-soft: rgba(255, 51, 51, 0.15);
    --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08);
    --glass-hover: rgba(255, 255, 255, 0.07);
    --font-display: 'Neu Eichmass', 'Anton', 'Impact', sans-serif;
    --font-heading: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-stat: 'Bebas Neue', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body { min-height: 100%; background-color: var(--color-bg); font-family: var(--font-body); color: var(--color-text); overflow-y: auto; line-height: 1.6; }
  .bg-layer { position: fixed; inset: 0; pointer-events: none; }
  .bg-base { z-index: 1; background-color: var(--color-bg); }
  .bg-red { z-index: 2; background: radial-gradient(ellipse 60% 70% at 20% 40%, #ff0000 0%, #990000 50%, transparent 70%), radial-gradient(ellipse 50% 60% at 70% 80%, #e60000 0%, #800000 40%, transparent 70%); opacity: 0.7; animation: redPulse 18s ease-in-out infinite alternate; }
  .bg-gray { z-index: 3; background: radial-gradient(ellipse 50% 60% at 75% 30%, #ffffff 0%, #808080 45%, transparent 70%), radial-gradient(ellipse 40% 50% at 30% 85%, #f0f0f0 0%, #999999 30%, transparent 65%); opacity: 0.5; animation: grayDrift 22s ease-in-out infinite alternate; }
  .bg-mauve { z-index: 4; background: radial-gradient(circle at 60% 50%, #c8a0a0 0%, transparent 30%), radial-gradient(circle at 25% 70%, #b08080 0%, transparent 25%); opacity: 0.3; animation: mauveFloat 26s ease-in-out infinite alternate; }
  .bg-noise { z-index: 5; opacity: 0.03; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>"); }
  @keyframes redPulse { 0% { transform: scale(1) translate(0, 0); opacity: 0.7; } 100% { transform: scale(1.05) translate(-1%, 1%); opacity: 0.75; } }
  @keyframes grayDrift { 0% { transform: translate(0, 0); } 100% { transform: translate(-2%, 1.5%); } }
  @keyframes mauveFloat { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(1.5%, -1.5%) scale(1.03); } }

  .container { position: relative; z-index: 10; max-width: 640px; margin: 0 auto; padding: 60px 24px; min-height: 100vh; display: flex; flex-direction: column; }
  .brand { font-family: var(--font-display); font-size: clamp(3rem, 12vw, 5rem); font-weight: 400; letter-spacing: 0.03em; text-transform: uppercase; line-height: 0.9; background: linear-gradient(135deg, #ffffff 0%, #ff4444 60%, #c8a0a0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; text-shadow: 0 0 40px rgba(255, 0, 0, 0.2); }
  .tagline { font-family: var(--font-mono); font-size: 0.85rem; color: var(--color-text-dim); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 48px; padding-left: 2px; }
  .menu-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 48px; }
  .menu-card { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 24px; text-decoration: none; color: var(--color-text); display: flex; align-items: center; gap: 20px; transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); position: relative; overflow: hidden; }
  .menu-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent); transform: translateX(-100%); transition: transform 0.6s ease; }
  .menu-card:hover { background: var(--glass-hover); border-color: rgba(255, 51, 51, 0.3); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); }
  .menu-card:hover::before { transform: translateX(100%); }
  .icon-box { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.05); border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); }
  .icon-box svg { width: 24px; height: 24px; stroke: var(--color-text); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .menu-info h3 { font-family: var(--font-heading); font-size: 1.15rem; font-weight: 500; margin-bottom: 4px; }
  .menu-info p { font-size: 0.9rem; color: var(--color-text-dim); font-weight: 300; }
  .card-disabled { opacity: 0.4; pointer-events: none; }

  .social-links { display: flex; gap: 16px; justify-content: center; margin-top: auto; padding-top: 32px; }
  .social-link { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--color-text-dim); transition: all 0.3s ease; }
  .social-link:hover { background: var(--glass-hover); border-color: var(--color-accent); color: var(--color-text); transform: translateY(-2px); }
  .social-link svg { width: 20px; height: 20px; fill: currentColor; }
  .footer { text-align: center; font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-text-dim); margin-top: 24px; }
</style>
</head>
