<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Savedata - NexaHdr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Neu Eichmass';
    src: url('fonts/Neu_Eichmass.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --color-bg: #050505;
    --color-text: #f0f0f0;
    --color-text-dim: #888888;
    --color-accent: #ff3333;
    --color-accent-soft: rgba(255, 51, 51, 0.15);
    --glass-bg: rgba(10, 10, 10, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-hover: rgba(20, 20, 20, 0.8);
    
    --font-display: 'Neu Eichmass', 'Anton', 'Impact', sans-serif;
    --font-heading: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-stat: 'Bebas Neue', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100%; background-color: var(--color-bg);
    font-family: var(--font-body); color: var(--color-text);
    overflow-y: auto; line-height: 1.6;
  }

  .bg-layer { position: fixed; inset: 0; pointer-events: none; }
  .bg-base { z-index: 1; background-color: var(--color-bg); }
  .bg-red { z-index: 2; background: radial-gradient(ellipse 60% 70% at 20% 40%, #ff0000 0%, #990000 50%, transparent 70%), radial-gradient(ellipse 50% 60% at 70% 80%, #e60000 0%, #800000 40%, transparent 70%); opacity: 0.7; animation: redPulse 18s ease-in-out infinite alternate; }
  .bg-gray { z-index: 3; background: radial-gradient(ellipse 50% 60% at 75% 30%, #ffffff 0%, #808080 45%, transparent 70%), radial-gradient(ellipse 40% 50% at 30% 85%, #f0f0f0 0%, #999999 30%, transparent 65%); opacity: 0.5; animation: grayDrift 22s ease-in-out infinite alternate; }
  .bg-mauve { z-index: 4; background: radial-gradient(circle at 60% 50%, #c8a0a0 0%, transparent 30%), radial-gradient(circle at 25% 70%, #b08080 0%, transparent 25%); opacity: 0.3; animation: mauveFloat 26s ease-in-out infinite alternate; }
  .bg-noise { z-index: 5; opacity: 0.03; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>"); }
  @keyframes redPulse { 0% { transform: scale(1) translate(0, 0); opacity: 0.7; } 100% { transform: scale(1.05) translate(-1%, 1%); opacity: 0.75; } }
  @keyframes grayDrift { 0% { transform: translate(0, 0); } 100% { transform: translate(-2%, 1.5%); } }
  @keyframes mauveFloat { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(1.5%, -1.5%) scale(1.03); } }

  .container { position: relative; z-index: 10; max-width: 640px; margin: 0 auto; padding: 40px 24px; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--color-text-dim); text-decoration: none;
    font-family: var(--font-mono); font-size: 0.8rem;
    margin-bottom: 32px; transition: color 0.3s ease;
  }
  .back-btn:hover { color: var(--color-text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .page-title {
    font-family: var(--font-display);
    font-size: clamp(2.2rem, 8vw, 3rem);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    line-height: 0.95;
    margin-bottom: 32px;
    padding-left: 16px;
    border-left: 3px solid var(--color-accent);
  }

  /* Search & Filter */
  .controls {
    display: flex; flex-direction: column; gap: 12px;
    margin-bottom: 32px;
  }
  .search-box {
    position: relative;
  }
  .search-box input {
    width: 100%; padding: 12px 16px 12px 44px;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 0.95rem;
    transition: all 0.3s ease;
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--color-accent);
    background: var(--glass-hover);
  }
  .search-box svg {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    stroke: var(--color-text-dim);
    fill: none; stroke-width: 2;
  }

  .filter-row {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .filter-btn {
    padding: 8px 16px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    color: var(--color-text-dim);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .filter-btn:hover {
    background: var(--glass-hover);
    color: var(--color-text);
  }
  .filter-btn.active {
    background: var(--color-accent-soft);
    border-color: var(--color-accent);
    color: var(--color-accent);
  }

  .link-list { display: flex; flex-direction: column; gap: 24px; }
  
  .link-card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 12px; overflow: hidden;
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .link-card:hover {
    border-color: rgba(255, 51, 51, 0.3);
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }

  .yt-thumb {
    width: 100%; aspect-ratio: 16/9; object-fit: cover;
    background: #0a0a0a; display: block; border-bottom: 1px solid var(--glass-border);
  }

  .card-body { padding: 20px; }
  
  .card-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .card-date {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--color-accent);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .card-version {
    font-family: var(--font-stat);
    font-size: 0.9rem;
    color: var(--color-text-dim);
    letter-spacing: 0.05em;
  }

  .card-title {
    font-family: var(--font-heading);
    font-size: 1.1rem; font-weight: 500; margin-bottom: 8px;
    line-height: 1.4;
  }

  .card-description {
    font-size: 0.85rem;
    color: var(--color-text-dim);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .card-tags {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .tag {
    padding: 4px 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--color-text-dim);
  }

  .btn-download {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; text-decoration: none;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--color-text); padding: 12px;
    border-radius: 8px; font-family: var(--font-body);
    font-size: 0.9rem; font-weight: 500;
    transition: all 0.3s ease;
  }
  .btn-download:hover {
    background: var(--color-accent);
    border-color: var(--color-accent);
    color: #ffffff;
  }
  .btn-download svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

  .loading {
    text-align: center; color: var(--color-text-dim);
    font-family: var(--font-mono); font-size: 0.85rem;
    margin-top: 60px;
  }

  .no-results {
    text-align: center;
    color: var(--color-text-dim);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    margin-top: 40px;
  }
</style>
</head>
<body>
  <div class="bg-layer bg-base"></div>
  <div class="bg-layer bg-red"></div>
  <div class="bg-layer bg-gray"></div>
  <div class="bg-layer bg-mauve"></div>
  <div class="bg-layer bg-noise"></div>

  <div class="container">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>return_to_root</span>
    </a>
    
    <h1 class="page-title">Game Savedata</h1>

    <div class="controls">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search savedata...">
      </div>
      <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-filter="all">All</button>
      </div>
    </div>
    
    <div id="link-list" class="link-list">
      <p class="loading">> initializing_data_stream...</p>
    </div>
  </div>

  <script>
    let allData = [];
    let currentFilter = 'all';

    function getYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function renderCards(data) {
      const container = document.getElementById('link-list');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<p class="no-results">> no_records_found.</p>';
        return;
      }

      data.forEach(item => {
        const ytID = getYouTubeID(item.youtube_url);
        const thumbUrl = ytID ? `https://img.youtube.com/vi/${ytID}/mqdefault.jpg` : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" fill="%23111"><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="%23444" font-family="monospace">NO_PREVIEW</text></svg>';

        const tags = item.tags ? item.tags.map(tag => `<span class="tag">${tag}</span>`).join('') : '';

        const card = document.createElement('div');
        card.className = 'link-card';
        card.innerHTML = `
          <img src="${thumbUrl}" alt="Preview" class="yt-thumb" loading="lazy">
          <div class="card-body">
            <div class="card-meta">
              <span class="card-date">${item.date}</span>
              ${item.version ? `<span class="card-version">v${item.version}</span>` : ''}
            </div>
            <div class="card-title">${item.title}</div>
            ${item.description ? `<div class="card-description">${item.description}</div>` : ''}
            ${tags ? `<div class="card-tags">${tags}</div>` : ''}
            <a href="${item.download_url}" target="_blank" rel="noopener noreferrer" class="btn-download">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              <span>Download Artifact</span>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterData() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allData;

      if (currentFilter !== 'all') {
        filtered = filtered.filter(item => item.game_name && item.game_name.toLowerCase() === currentFilter);
      }

      if (searchTerm) {
        filtered = filtered.filter(item => 
          item.title.toLowerCase().includes(searchTerm) ||
          (item.game_name && item.game_name.toLowerCase().includes(searchTerm)) ||
          (item.description && item.description.toLowerCase().includes(searchTerm))
        );
      }

      renderCards(filtered);
    }

    function buildFilters() {
      const games = [...new Set(allData.map(item => item.game_name).filter(Boolean))];
      const filterRow = document.getElementById('filterRow');
      
      games.forEach(game => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.filter = game.toLowerCase();
        btn.textContent = game;
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          filterData();
        };
        filterRow.appendChild(btn);
      });
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.querySelector('[data-filter="all"]').onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-filter="all"]').classList.add('active');
      currentFilter = 'all';
      filterData();
    };

    fetch('menu1_data.json?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        allData = data.reverse();
        buildFilters();
        renderCards(allData);
      })
      .catch(err => {
        console.error(err);
        document.getElementById('link-list').innerHTML = '<p class="loading" style="color: #ff3333;">> error: failed_to_fetch_data.</p>';
      });
  </script>
</body>
</html>
